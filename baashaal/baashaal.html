<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Form</title>
  </head>
  <body>
    <h1>Race registration</h1>
    <form>
      <div>
        <label for="first">First name</label>
        <input
          type="text"
          name="firstname"
          id="first"
          required
        />

        <label for="last">Last name</label>
        <input
          type="text"
          name="lastname"
          id="last"
          required
        />
      </div>
      <fieldset>
        <legend>Select a Race:</legend>
        <div>
          <input
            type="radio"
            name="race"
            id="fun"
            value="fun-run"
            required
          />
          <label for="fun">Fun Run 5k</label>
        </div>
        <div>
          <input
            value="half"
            type="radio"
            name="race"
            id="half"
          />
          <label for="half">Half Marathon</label>
        </div>
        <div>
          <input
            type="radio"
            name="race"
            id="full"
            value="full"
          />
          <label for="full">Full Marathon</label>
        </div>
      </fieldset>
      <div>
        <label for="email">Email</label>
        <input
          type="email"
          name="email"
          id="email"
          required
        />
      </div>
      <div>
        <label for="pass">password</label>
        <input
          type="password"
          name="password"
          id="pass"
          required
        />
      </div>
      <div>
        <label for="age">choose your age</label>
        <select
          name="age"
          id="age"
          required
        >
          <option
            value=""
            disabled
            selected
          >
            choose age
          </option>
          <option value="under-18">Under 18</option>
          <option value="18-25">18-25</option>
          <option value="26-35">26-35</option>
          <option value="36-49">36-49</option>
          <option value="50-plus">50+</option>
        </select>
      </div>
      <div>
        <button type="submit">Register</button>
      </div>
    </form>
  </body>
</html>
